name: Apply finalized receipt polling patch

on:
  push:
    branches: [feat/write-execution-receipts]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'generated finalized receipt polling') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/write-execution-receipts
          fetch-depth: 0

      - name: Apply polling patch
        run: node scripts/fix-receipt-polling.mjs

      - name: Verify extension
        working-directory: extension
        run: |
          npm run check
          npm test

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/extension.js
          git commit -m "fix: apply generated finalized receipt polling"
          git push origin HEAD:feat/write-execution-receipts
