name: Apply client request id integration

on:
  push:
    branches: [feat/write-execution-receipts]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'generated client request id') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/write-execution-receipts
          fetch-depth: 0

      - name: Apply request id patch
        run: node scripts/apply-client-request-id.mjs

      - name: Verify server and extension
        run: |
          cd server
          npm run check
          npm test
          cd ../extension
          npm run check
          npm test

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/index.test.js extension/src/extension.js
          git commit -m "feat: apply generated client request id integration"
          git push origin HEAD:feat/write-execution-receipts
