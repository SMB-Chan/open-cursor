name: Apply autonomous main compatibility

on:
  push:
    branches: [fix/auto-routing-safety]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'generated autonomous compatibility') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/auto-routing-safety
          fetch-depth: 0

      - name: Apply compatibility migration
        run: node scripts/apply-autonomous-main.mjs

      - name: Verify generated sources parse
        run: |
          node --check server/engine.js
          node --check server/index.js
          node --check extension/src/extension.js

      - name: Commit generated compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine.js server/index.js extension/src/extension.js
          git commit -m "fix: apply generated autonomous compatibility"
          git push origin HEAD:fix/auto-routing-safety
