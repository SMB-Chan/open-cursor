name: Apply routing documentation refresh

on:
  push:
    branches: [fix/auto-routing-safety]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'generated routing documentation refresh') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/auto-routing-safety
          fetch-depth: 0

      - name: Apply documentation refresh
        run: node scripts/update-routing-docs.mjs

      - name: Verify stale claims are gone
        run: |
          grep -q 'workspaceAccess: "none"' README.md
          grep -q 'Autonomous' README.md
          grep -q 'MIMO_ENDPOINT' README.md
          ! grep -q 'Open-Cursor itself does not require a per-call billing API' README.md

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: apply generated routing documentation refresh"
          git push origin HEAD:fix/auto-routing-safety
