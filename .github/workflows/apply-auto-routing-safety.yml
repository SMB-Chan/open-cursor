name: Apply auto routing safety migration

on:
  push:
    branches: [fix/auto-routing-safety]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'generated auto routing safety migration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/auto-routing-safety
          fetch-depth: 0

      - name: Apply migration
        run: node scripts/apply-auto-routing-safety.mjs

      - name: Verify generated sources parse
        run: |
          node --check server/engine.js
          node --check server/index.js
          node --check server/config.js
          node --check server/routing-safety.test.js
          node -e 'JSON.parse(require("fs").readFileSync("config/bridge.json","utf8")); JSON.parse(require("fs").readFileSync("config/config.schema.json","utf8"));'

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/engine.js server/index.js server/config.js server/package.json config/bridge.json config/config.schema.json
          git commit -m "fix: apply generated auto routing safety migration"
          git push origin HEAD:fix/auto-routing-safety
