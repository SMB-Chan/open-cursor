name: Fix mobile workspace header forwarding

on:
  push:
    branches: [fix/mobile-dashboard-security]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'generated mobile workspace header fix') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/mobile-dashboard-security
          fetch-depth: 0

      - name: Patch workspace header and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('mobile/server.js')
          text = server.read_text()
          old = '        "X-Workspace-Path": encodeURI(WORKSPACE_DIR),'
          new = '        "X-Workspace-Path": WORKSPACE_DIR,'
          if old not in text:
              raise SystemExit('workspace header anchor not found')
          server.write_text(text.replace(old, new, 1))

          test = Path('mobile/server.test.js')
          source = test.read_text()
          marker = 'test("workspace header is forwarded verbatim to preserve spaces and non-ASCII paths"'
          if marker not in source:
              source += '''\n\ntest("workspace header is forwarded verbatim to preserve spaces and non-ASCII paths", async () => {\n  const source = await readFile(new URL("./server.js", import.meta.url), "utf8");\n  assert.match(source, /"X-Workspace-Path": WORKSPACE_DIR/);\n  assert.doesNotMatch(source, /encodeURI\\(WORKSPACE_DIR\\)/);\n});\n'''
              test.write_text(source)
          PY

      - name: Verify mobile dashboard
        working-directory: mobile
        run: |
          npm run check
          npm test

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/server.js mobile/server.test.js
          git commit -m "fix: apply generated mobile workspace header fix"
          git push origin HEAD:fix/mobile-dashboard-security
