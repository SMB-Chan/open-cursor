name: Harden mobile tunnel bind

on:
  push:
    branches: [feat/secure-mobile-transport]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'generated tunnel bind hardening') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/secure-mobile-transport
          fetch-depth: 0

      - name: Apply tunnel bind hardening
        run: node scripts/harden-mobile-tunnel-bind.mjs

      - name: Verify mobile transport
        working-directory: mobile
        run: |
          npm run check
          npm test

      - name: Verify launcher
        run: |
          bash -n bin/open-cursor
          grep -q 'Tunnel mode refuses wildcard MOBILE_HOST' bin/open-cursor
          grep -q 'specific MOBILE_HOST' mobile/server.js
          grep -q 'Loopback tunnel mode requires MOBILE_PUBLIC_URL' bin/open-cursor

      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/server.js mobile/server.test.js bin/open-cursor README.md
          git commit -m "fix: apply generated tunnel bind hardening"
          git push origin HEAD:feat/secure-mobile-transport
