name: Apply execution receipt integration

on:
  push:
    branches: [feat/write-execution-receipts]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'generated execution receipt integration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/write-execution-receipts
          fetch-depth: 0

      - name: Apply integration
        run: node scripts/apply-execution-receipts.mjs

      - name: Verify server
        working-directory: server
        run: |
          npm run check
          npm test

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/engine.js
          git commit -m "feat: apply generated execution receipt integration"
          git push origin HEAD:feat/write-execution-receipts
