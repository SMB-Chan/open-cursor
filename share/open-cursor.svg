<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa502;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Cursor shape -->
  <path d="M80 60 L80 196 L140 140 L196 140 Z" fill="url(#accent)" opacity="0.9"/>
  <path d="M80 60 L140 140 L196 140" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Dual-agent circles -->
  <circle cx="170" cy="90" r="30" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.7"/>
  <circle cx="170" cy="90" r="12" fill="url(#accent)" opacity="0.8"/>
  <circle cx="100" cy="190" r="26" fill="none" stroke="url(#accent2)" stroke-width="4" opacity="0.7"/>
  <circle cx="100" cy="190" r="10" fill="url(#accent2)" opacity="0.8"/>
  <!-- Connection line -->
  <line x1="170" y1="120" x2="100" y2="164" stroke="white" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <!-- "OC" text -->
  <text x="128" y="236" font-family="monospace" font-size="28" font-weight="bold" fill="white" text-anchor="middle" opacity="0.6">OC</text>
</svg>
